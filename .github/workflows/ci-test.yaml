name: Test Pipeline

on:
  workflow_call:
    secrets:
      PRIVATE_KEY: { required: true }

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create private key file
        run: |
          mkdir -p api/v1/routes
          echo "${{ secrets.PRIVATE_KEY }}" > api/v1/routes/private_key.pem

      - name: Run tests
        run: uv run --project api pytest api/tests/ -v
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
