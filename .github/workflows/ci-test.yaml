name: Test Pipeline

on:
  workflow_call:
    inputs:
      image-tag: { required: true, type: string }
    secrets:
      AWS_ACCOUNT_ID: { required: true }
      AWS_REGION: { required: true }
      PRIVATE_KEY: { required: true }

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS
        uses: ./.github/actions/aws-setup
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/filesoncloud-oidc
          role-session-name: github-test

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Terraform apply
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create private key file
        run: |
          mkdir -p api/v1/routes
          echo "${{ secrets.PRIVATE_KEY }}" > api/v1/routes/private_key.pem

      - name: Start Redis for testing
        run: |
          docker run -d --name test-redis \
            -p 6379:6379 \
            redis:7-alpine \
            redis-server --requiredpass testpassword

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if docker exec test-redis redis-cli -a testpassword ping | grep -q "PONG"; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run tests
        run: |
          TEST_IMAGE_URI="${{ env.ECR_REGISTRY }}/filesoncloud-app:${{ inputs.image-tag }}-test"

          docker run --rm \
            -v $(pwd)/api/v1/routes/private_key.pem:/app/v1/routes/private_key.pem \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e AWS_SECRET_NAME=filesoncloud-app-secrets \
            "${TEST_IMAGE_URI}" \
            python -m pytest tests/ -v

      - name: Cleanup
        if: always()
        run: |
          docker stop test-redis || true
          docker rm test-redis || true
