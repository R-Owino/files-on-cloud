name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      image-tag: { required: true, type: string }
    secrets:
      AWS_ACCOUNT_ID: { required: true }
      AWS_REGION: { required: true }
    outputs:
      cluster-name:
        description: "ECS cluster name"
        value: ${{ jobs.deploy-infra.outputs.cluster-name }}
      service-name:
        description: "ECS service name"
        value: ${{ jobs.deploy-infra.outputs.service-name }}
      task-definition-family:
        description: "ECS task definition family"
        value: ${{ jobs.deploy-infra.outputs.task-definition-family }}

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      cluster-name: ${{ steps.terraform-outputs.outputs.cluster-name }}
      service-name: ${{ steps.terraform-outputs.outputs.service-name }}
      task-definition-family: ${{ steps.terraform-outputs.outputs.task-definition-family }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup

      - name: Setup AWS credentials
        uses: ./.github/actions/aws-setup
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/filesoncloud-oidc
          role-session-name: github-deploy

      - name: Run Terraform init
        run: terraform -chdir=infra init

      - name: Import pre-existing AWS resources
        run: bash scripts/import-infra.sh infra

      - name: Stage 1 - provision certificate and DNS validation records
        run: |
          terraform -chdir=infra apply -auto-approve \
            -target=module.acm.aws_acm_certificate.filesoncloud_cert \
            -target=module.acm.aws_route53_record.cert_validation

      - name: Stage 1 - wait for certificate validation
        run: |
          CERT_ARN=$(terraform -chdir=infra output -raw certificate_arn)
          echo "Waiting for certificate: ${CERT_ARN}"
          aws acm wait certificate-validated \
            --certificate-arn "${CERT_ARN}" \
            --region "${AWS_REGION}"

      - name: Stage 2 - apply full infrastructure
        run: |
          FLASK_IMAGE_URI="${{ env.ECR_REGISTRY }}/filesoncloud-app:${{ inputs.image-tag }}"
          REDIS_IMAGE_URI="${{ env.ECR_REGISTRY }}/filesoncloud-redis:${{ inputs.image-tag }}"

          plan() {
            terraform -chdir=infra plan \
              -var="flask_image_uri=${FLASK_IMAGE_URI}" \
              -var="redis_image_uri=${REDIS_IMAGE_URI}" \
              -out=tfplan
          }

          plan
          if ! terraform -chdir=infra apply -auto-approve tfplan; then
            echo "Apply failed — importing pre-existing resources and retrying..."
            bash scripts/import-infra.sh infra
            plan
            terraform -chdir=infra apply -auto-approve tfplan
          fi

      - name: Infra outputs for deploy app pipeline
        id: terraform-outputs
        run: |
          CLUSTER_NAME=$(terraform -chdir=infra output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform -chdir=infra output -raw ecs_service_name)
          TASK_DEF_FAMILY=$(terraform -chdir=infra output -raw ecs_task_definition_family)

          echo "cluster-name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "service-name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "task-definition-family=${TASK_DEF_FAMILY}" >> $GITHUB_OUTPUT
